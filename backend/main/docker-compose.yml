version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: project3-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: project3database
    ports:
      - "5432:5432"
    volumes:
      # Mount the SQL script to the initialization directory
      # PostgreSQL will automatically run all .sql files in /docker-entrypoint-initdb.d/
      # on first container creation
      - ./src/datasources/database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Persist data in a named volume
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d project3database"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

